<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>グラフ作成ツール</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }
    input, select, button {
      min-height: 36px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm py-1.5 px-3">
    <div class="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-2">
      <!-- タブ切り替えボタン -->
      <div class="flex space-x-2">
        <button id="tabBtnGraph" onclick="switchTab('graph')" class="px-3 py-1 rounded-lg font-bold transition-all text-xs sm:text-sm bg-indigo-600 text-white shadow">
          グラフ
        </button>
        <button id="tabBtnInput" onclick="switchTab('input')" class="px-3 py-1 rounded-lg font-bold transition-all text-xs sm:text-sm bg-slate-100 text-slate-600 hover:bg-slate-200">
          設定
        </button>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <!-- プリセット選択ボタン -->
        <div class="flex items-center gap-1">
          <span class="font-bold text-slate-500 hidden sm:inline">プリセット:</span>
          <select id="presetSelect" onchange="loadPreset(this.value)" class="px-2 py-1 border border-slate-300 rounded-lg bg-white font-bold text-slate-700 outline-none">
            <optgroup label="標準プリセット">
              <option value="temp">1週間の最高気温 (折れ線)</option>
              <option value="sports">人気のスポーツ (棒)</option>
              <option value="schedule">中学生の1日の過ごし方 (円)</option>
            </optgroup>
            <optgroup id="savedPresetsGroup" label="★ 保存したグラフ" class="hidden">
              <!-- 動的に追加 -->
            </optgroup>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- トースト通知用のコンテナ -->
  <div id="toast" class="fixed top-12 right-4 z-50 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg text-xs font-bold transition-opacity duration-300 opacity-0 pointer-events-none">
    リンクをコピーしました！
  </div>

  <main class="max-w-6xl mx-auto px-2 sm:px-3 py-1">

    <div id="pageGraph" class="space-y-1.5">

      <div class="bg-white rounded-xl p-2.5 sm:p-3 shadow-sm border border-slate-200 space-y-1.5">
        
        <!-- グラフ描画領域（余白削減で画面いっぱいに拡大） -->
        <div class="chart-container relative w-full h-[280px] sm:h-[340px] md:h-[380px]">
          <canvas id="myChart"></canvas>
        </div>

        <!-- インライン編集可能なデータテーブル -->
        <div class="pt-0.5">
          <div id="graphPageTable" class="overflow-x-auto">
            <!-- JavaScriptで同期生成 -->
          </div>

          <!-- 項目の追加・削除ボタン（表の下に配置） -->
          <div class="flex justify-end gap-2 mt-1.5">
            <button onclick="addRow(); renderGraph();" class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold border border-indigo-200 transition-colors">＋ 項目を追加</button>
            <button onclick="removeRow(); renderGraph();" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg text-xs font-bold border border-rose-200 transition-colors">－ 削除</button>
          </div>
        </div>

        <!-- グラフの種類選択（一番下・うすい水色塗りつぶしなし） -->
        <div class="border-t border-slate-100 pt-1.5 flex justify-center items-center gap-2">
          <span class="text-xs font-bold text-slate-600">グラフの種類:</span>
          <select id="chartType" onchange="renderGraph()" class="px-3 py-1 border border-slate-300 bg-white rounded-lg font-bold text-slate-800 text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="line">折れ線グラフ（変化・推移）</option>
            <option value="bar">棒グラフ（数量の比較）</option>
            <option value="pie">円グラフ（割合・構成比）</option>
          </select>
        </div>

      </div>

    </div>

    <div id="pageInput" class="hidden space-y-3">

      <!-- 1. 基本設定 -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 border-b pb-1.5 mb-3 flex items-center gap-2">
          <span class="w-2 h-3.5 bg-indigo-600 rounded-full"></span>
          基本設定
        </h2>
        
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">グラフのタイトル</label>
            <input type="text" id="graphTitle" value="1週間の最高気温の移り変わり" oninput="onDataChanged()" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">横軸の項目名</label>
              <input type="text" id="xAxisLabel" value="曜日" oninput="onDataChanged()" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">縦軸の項目名</label>
              <input type="text" id="yAxisLabel" value="最高気温" oninput="onDataChanged()" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">単位</label>
              <input type="text" id="yAxisUnit" value="℃" placeholder="例: ℃, 人" oninput="onDataChanged()" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
          </div>
        </div>
      </section>

      <!-- 2. 目盛り設定 -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 border-b pb-1.5 mb-3 flex items-center gap-2">
          <span class="w-2 h-3.5 bg-indigo-600 rounded-full"></span>
          目盛り設定（空欄時は自動）
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">縦軸の最小値</label>
            <input type="number" id="yMin" placeholder="自動 (最小値-1)" oninput="onDataChanged()" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">縦軸の最大値</label>
            <input type="number" id="yMax" placeholder="自動 (最大値+1)" oninput="onDataChanged()" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">目盛りの幅（刻み）</label>
            <input type="number" id="yStep" placeholder="自動" oninput="onDataChanged()" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
      </section>

      <!-- 3. データ表（設定画面側） -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 border-b pb-1.5 mb-3 flex items-center gap-2">
          <span class="w-2 h-3.5 bg-indigo-600 rounded-full"></span>
          データ編集
        </h2>

        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
              <tr>
                <th class="p-2 w-10 text-center">#</th>
                <th class="p-2">項目名</th>
                <th class="p-2 w-32">数値</th>
              </tr>
            </thead>
            <tbody id="dataTableBody" class="divide-y divide-slate-100">
              <!-- JSで動的読み込み -->
            </tbody>
          </table>
        </div>

        <div class="flex justify-end gap-2 mt-3">
          <button onclick="addRow()" class="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold border border-indigo-200 transition-colors">＋ 項目を追加</button>
          <button onclick="removeRow()" class="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg text-xs font-bold border border-rose-200 transition-colors">－ 削除</button>
        </div>
      </section>

      <!-- 4. ブラウザ内での名前を付けて保存 -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 border-b pb-1.5 mb-3 flex items-center gap-2">
          <span class="w-2 h-3.5 bg-indigo-600 rounded-full"></span>
          グラフの保存（一時保存）
        </h2>
        <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center">
          <input type="text" id="saveNameInput" placeholder="例: クラスのテスト結果" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none flex-1">
          <button onclick="saveCurrentGraphInMemory()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs transition-colors flex items-center justify-center gap-1 shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            名前を付けて保存
          </button>
        </div>
        <p class="text-[11px] text-slate-500 mt-1.5">※ 保存したデータは上の「プリセット」選択肢に追加され、簡単に切り替えられます。</p>
      </section>

      <!-- 5. 配布用リンク作成 -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 border-b pb-1.5 mb-3 flex items-center gap-2">
          <span class="w-2 h-3.5 bg-emerald-600 rounded-full"></span>
          配布用リンクの作成
        </h2>
        <div class="space-y-3">
          <label class="block text-xs font-bold text-slate-600">共有モードの選択:</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2.5 border rounded-lg cursor-pointer bg-slate-50 hover:bg-indigo-50/50 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/30">
              <input type="radio" name="shareMode" value="graph" checked class="text-indigo-600 focus:ring-indigo-500">
              <div>
                <span class="font-bold text-slate-800 block">グラフ表示画面のみ</span>
                <span class="text-[11px] text-slate-500">生徒が開いた際、直接グラフ画面が表示されます</span>
              </div>
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg cursor-pointer bg-slate-50 hover:bg-indigo-50/50 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/30">
              <input type="radio" name="shareMode" value="full" class="text-indigo-600 focus:ring-indigo-500">
              <div>
                <span class="font-bold text-slate-800 block">全機能（データ入力 ＋ グラフ）</span>
                <span class="text-[11px] text-slate-500">設定タブとグラフタブの両方が利用可能です</span>
              </div>
            </label>
          </div>

          <button onclick="copyShareLink()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs sm:text-sm transition-colors flex items-center justify-center gap-2 shadow">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            配布用リンクを作成してコピー
          </button>
        </div>
      </section>

    </div>

  </main>

  <script>
    let chartInstance = null;
    let currentTab = 'graph';

    // プリセットデータ定義（ダンス追加・バラバラの順・中学生の過ごし方）
    const presets = {
      temp: {
        title: "1週間の最高気温の移り変わり",
        xLabel: "曜日",
        yLabel: "最高気温",
        unit: "℃",
        type: "line",
        data: [
          { label: "月", val: 18 },
          { label: "火", val: 20 },
          { label: "水", val: 19 },
          { label: "木", val: 22 },
          { label: "金", val: 25 },
          { label: "土", val: 23 },
          { label: "日", val: 21 }
        ]
      },
      sports: {
        title: "クラスで人気のスポーツ調べ",
        xLabel: "種目",
        yLabel: "人数",
        unit: "人",
        type: "bar",
        data: [
          { label: "サッカー", val: 7 },
          { label: "ダンス", val: 10 },
          { label: "バスケ", val: 5 },
          { label: "水泳", val: 8 },
          { label: "陸上", val: 3 }
        ]
      },
      schedule: {
        title: "中学生の1日の過ごし方",
        xLabel: "内容",
        yLabel: "時間",
        unit: "時間",
        type: "pie",
        data: [
          { label: "睡眠", val: 7 },
          { label: "学校", val: 7 },
          { label: "部活動", val: 2 },
          { label: "家庭学習", val: 2 },
          { label: "自由時間", val: 4 },
          { label: "食事・その他", val: 2 }
        ]
      }
    };

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
      // URLハッシュから設定の復元を試みる
      if (!loadFromHash()) {
        loadPreset('temp'); // ハッシュがなければデフォルトの気温プリセット
      }
      switchTab('graph');
    });

    // プリセット読み込み
    function loadPreset(key) {
      const p = presets[key];
      if (!p) return;
      applyConfig(p);
    }

    function applyConfig(cfg) {
      document.getElementById('graphTitle').value = cfg.title || '';
      document.getElementById('xAxisLabel').value = cfg.xLabel || '';
      document.getElementById('yAxisLabel').value = cfg.yLabel || '';
      document.getElementById('yAxisUnit').value = cfg.unit || '';
      document.getElementById('chartType').value = cfg.type || 'line';
      document.getElementById('yMin').value = cfg.yMin !== undefined ? cfg.yMin : '';
      document.getElementById('yMax').value = cfg.yMax !== undefined ? cfg.yMax : '';
      document.getElementById('yStep').value = cfg.yStep !== undefined ? cfg.yStep : '';

      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '';
      (cfg.data || []).forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="text-center font-bold text-slate-400 p-1.5">${idx + 1}</td>
          <td class="p-1"><input type="text" class="input-label w-full px-2 py-1 border rounded text-xs focus:ring-1 focus:ring-indigo-500" value="${item.label}"></td>
          <td class="p-1"><input type="number" class="input-val w-full px-2 py-1 border rounded text-xs focus:ring-1 focus:ring-indigo-500" value="${item.val}"></td>
        `;
        tbody.appendChild(tr);
      });

      bindInputEvents();
      renderGraph();
    }

    function bindInputEvents() {
      const tbody = document.getElementById('dataTableBody');
      tbody.removeEventListener('input', onDataChanged);
      tbody.addEventListener('input', onDataChanged);
    }

    function onDataChanged() {
      renderGraph();
    }

    function switchTab(tabName) {
      currentTab = tabName;
      const pageInput = document.getElementById('pageInput');
      const pageGraph = document.getElementById('pageGraph');
      const tabBtnInput = document.getElementById('tabBtnInput');
      const tabBtnGraph = document.getElementById('tabBtnGraph');

      if (tabName === 'input') {
        pageInput.classList.remove('hidden');
        pageGraph.classList.add('hidden');
        tabBtnInput.className = "px-3 py-1 rounded-lg font-bold transition-all text-xs sm:text-sm bg-indigo-600 text-white shadow";
        tabBtnGraph.className = "px-3 py-1 rounded-lg font-bold transition-all text-xs sm:text-sm bg-slate-100 text-slate-600 hover:bg-slate-200";
      } else {
        pageInput.classList.add('hidden');
        pageGraph.classList.remove('hidden');
        tabBtnGraph.className = "px-3 py-1 rounded-lg font-bold transition-all text-xs sm:text-sm bg-indigo-600 text-white shadow";
        tabBtnInput.className = "px-3 py-1 rounded-lg font-bold transition-all text-xs sm:text-sm bg-slate-100 text-slate-600 hover:bg-slate-200";
        renderGraph();
      }
    }

    function addRow() {
      const tbody = document.getElementById('dataTableBody');
      const rowCount = tbody.children.length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="text-center font-bold text-slate-400 p-1.5">${rowCount}</td>
        <td class="p-1"><input type="text" class="input-label w-full px-2 py-1 border rounded text-xs focus:ring-1 focus:ring-indigo-500" value="項目${rowCount}"></td>
        <td class="p-1"><input type="number" class="input-val w-full px-2 py-1 border rounded text-xs focus:ring-1 focus:ring-indigo-500" value="0"></td>
      `;
      tbody.appendChild(tr);
      bindInputEvents();
    }

    function removeRow() {
      const tbody = document.getElementById('dataTableBody');
      if (tbody.children.length > 1) {
        tbody.removeChild(tbody.lastChild);
        bindInputEvents();
      }
    }

    function renderGraph() {
      const title = document.getElementById('graphTitle').value || '';
      const xLabel = document.getElementById('xAxisLabel').value || '';
      const yLabel = document.getElementById('yAxisLabel').value || '';
      const yUnit = document.getElementById('yAxisUnit').value || '';
      const chartType = document.getElementById('chartType').value;

      const fullYLabel = yUnit ? `${yLabel} (${yUnit})` : yLabel;

      // 入力データの取得
      const labels = [];
      const data = [];
      const labelInputs = document.querySelectorAll('.input-label');
      const valInputs = document.querySelectorAll('.input-val');

      labelInputs.forEach((input, index) => {
        labels.push(input.value || `項目${index + 1}`);
        data.push(parseFloat(valInputs[index].value) || 0);
      });

      // 同期表の生成
      syncInteractiveTable(labels, data, xLabel, fullYLabel);

      // データ最小値・最大値の算出
      const dataMin = data.length > 0 ? Math.min(...data) : 0;
      const dataMax = data.length > 0 ? Math.max(...data) : 10;

      const yMinInput = document.getElementById('yMin').value;
      const yMaxInput = document.getElementById('yMax').value;
      const yStepInput = document.getElementById('yStep').value;

      // ステップ幅の計算（未入力の場合はデータ範囲に合わせて自動決定）
      let step = yStepInput !== '' ? parseFloat(yStepInput) : null;
      if (!step || isNaN(step) || step <= 0) {
        const range = Math.max(dataMax - dataMin, 1);
        if (range <= 10) step = 1;
        else if (range <= 25) step = 2;
        else if (range <= 50) step = 5;
        else if (range <= 100) step = 10;
        else step = Math.pow(10, Math.floor(Math.log10(range))) || 1;
      }

      // 自動目盛りの計算：最小値・最大値をそれぞれ「目盛り幅1個分」外側に設定
      const computedMin = yMinInput !== '' ? parseFloat(yMinInput) : dataMin - step;
      const computedMax = yMaxInput !== '' ? parseFloat(yMaxInput) : dataMax + step;

      const ctx = document.getElementById('myChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      const colors = [
        '#3b82f6', '#ef4444', '#10b981', '#f59e0b', 
        '#8b5cf6', '#ec4899', '#14b8a6', '#64748b'
      ];

      let scalesConfig = {};
      if (chartType !== 'pie') {
        scalesConfig = {
          x: {
            title: {
              display: !!xLabel,
              text: xLabel,
              font: { weight: 'bold', size: 12 },
              color: '#334155'
            },
            ticks: { color: '#334155', font: { size: 11 } },
            grid: { color: '#f1f5f9' }
          },
          y: {
            title: {
              display: !!fullYLabel,
              text: fullYLabel,
              font: { weight: 'bold', size: 12 },
              color: '#334155'
            },
            ticks: { 
              color: '#334155', 
              font: { size: 11 },
              stepSize: step
            },
            grid: { color: '#e2e8f0' },
            min: computedMin,
            max: computedMax
          }
        };
      }

      chartInstance = new Chart(ctx, {
        type: chartType,
        data: {
          labels: labels,
          datasets: [{
            label: fullYLabel || '数値',
            data: data,
            backgroundColor: chartType === 'pie' ? colors : (chartType === 'bar' ? '#3b82f6' : 'transparent'),
            borderColor: chartType === 'pie' ? '#ffffff' : '#2563eb',
            borderWidth: 2,
            pointBackgroundColor: '#2563eb',
            pointRadius: 4,
            tension: 0.1,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: !!title,
              text: title,
              font: { size: 15, weight: 'bold' },
              color: '#0f172a',
              padding: { bottom: 8 }
            },
            legend: {
              display: chartType === 'pie',
              position: 'bottom',
              labels: { color: '#334155', font: { size: 11 } }
            }
          },
          scales: scalesConfig
        }
      });
    }

    function syncInteractiveTable(labels, data, xLabel, yLabel) {
      const container = document.getElementById('graphPageTable');
      
      let html = `
        <table class="w-full text-xs border-collapse border border-slate-300 min-w-[320px]">
          <thead>
            <tr class="bg-slate-100 text-slate-800">
              <th class="border border-slate-300 px-1 py-1 font-bold w-20 bg-slate-200 text-center">${xLabel || '項目'}</th>
      `;
      
      labels.forEach((l, idx) => {
        html += `
          <th class="border border-slate-300 p-0.5 font-bold text-center">
            <input type="text" data-index="${idx}" class="sync-label w-full px-1 py-0.5 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded text-center bg-transparent font-bold" value="${l}">
          </th>
        `;
      });

      html += `
            </tr>
          </thead>
          <tbody>
            <tr>
              <th class="border border-slate-300 px-1 py-1 font-bold bg-slate-100 text-slate-700 text-center">${yLabel || '数値'}</th>
      `;

      data.forEach((v, idx) => {
        html += `
          <td class="border border-slate-300 p-0.5 text-center">
            <input type="number" data-index="${idx}" class="sync-val w-full px-1 py-0.5 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded text-center" value="${v}">
          </td>
        `;
      });

      html += `
            </tr>
          </tbody>
        </table>
      `;

      container.innerHTML = html;

      container.querySelectorAll('.sync-label').forEach(input => {
        input.addEventListener('change', (e) => {
          const idx = e.target.getAttribute('data-index');
          const mainInputs = document.querySelectorAll('.input-label');
          if (mainInputs[idx]) {
            mainInputs[idx].value = e.target.value;
            renderGraph();
          }
        });
      });

      container.querySelectorAll('.sync-val').forEach(input => {
        input.addEventListener('change', (e) => {
          const idx = e.target.getAttribute('data-index');
          const mainInputs = document.querySelectorAll('.input-val');
          if (mainInputs[idx]) {
            mainInputs[idx].value = e.target.value;
            renderGraph();
          }
        });
      });
    }

    function getCurrentConfig() {
      const data = [];
      const labelInputs = document.querySelectorAll('.input-label');
      const valInputs = document.querySelectorAll('.input-val');

      labelInputs.forEach((input, index) => {
        data.push({
          label: input.value || `項目${index + 1}`,
          val: parseFloat(valInputs[index].value) || 0
        });
      });

      return {
        title: document.getElementById('graphTitle').value,
        xLabel: document.getElementById('xAxisLabel').value,
        yLabel: document.getElementById('yAxisLabel').value,
        unit: document.getElementById('yAxisUnit').value,
        type: document.getElementById('chartType').value,
        yMin: document.getElementById('yMin').value,
        yMax: document.getElementById('yMax').value,
        yStep: document.getElementById('yStep').value,
        data: data
      };
    }

    // 自作の保存データリスト（メモリ内）
    const mySavedPresets = {};

    // プリセット読み込み
    function loadPreset(key) {
      if (mySavedPresets[key]) {
        applyConfig(mySavedPresets[key]);
        return;
      }
      const p = presets[key];
      if (!p) return;
      applyConfig(p);
    }

    // 名前を付けて保存（ブラウザ内保存）
    function saveCurrentGraphInMemory() {
      const nameInput = document.getElementById('saveNameInput');
      const name = nameInput.value.trim() || `マイデータ ${Object.keys(mySavedPresets).length + 1}`;
      
      const config = getCurrentConfig();
      config.title = config.title || name;
      
      const key = `custom_${Date.now()}`;
      mySavedPresets[key] = config;

      // プリセットセレクトボックスの「マイ保存グラフ」グループに追加
      const group = document.getElementById('savedPresetsGroup');
      group.classList.remove('hidden');

      const option = document.createElement('option');
      option.value = key;
      option.textContent = `★ ${name}`;
      group.appendChild(option);

      document.getElementById('presetSelect').value = key;
      nameInput.value = '';

      showToast(`「${name}」を保存しました！`);
    }

    // 配布用リンク作成
    function copyShareLink() {
      const config = getCurrentConfig();
      const modeEl = document.querySelector('input[name="shareMode"]:checked');
      const shareMode = modeEl ? modeEl.value : 'graph';

      const jsonStr = JSON.stringify(config);
      const encoded = encodeURIComponent(jsonStr);
      
      const baseUrl = window.location.href.split('#')[0];
      const shareUrl = `${baseUrl}#mode=${shareMode}&data=${encoded}`;

      // クリップボードにコピー
      const tempInput = document.createElement('input');
      tempInput.value = shareUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);

      showToast('配布用リンクをコピーしました！');
    }

    // URLハッシュからの復元
    function loadFromHash() {
      const hash = window.location.hash;
      if (!hash || (!hash.includes('data=') && !hash.includes('mode='))) return false;

      try {
        let mode = 'graph';
        let jsonStr = '';

        const params = hash.replace('#', '').split('&');
        params.forEach(param => {
          if (param.startsWith('mode=')) {
            mode = param.replace('mode=', '');
          } else if (param.startsWith('data=')) {
            jsonStr = decodeURIComponent(param.replace('data=', ''));
          }
        });

        if (jsonStr) {
          const config = JSON.parse(jsonStr);
          applyConfig(config);
        }

        // 共有モードに応じた初期表示タブの設定
        if (mode === 'graph') {
          switchTab('graph');
        } else {
          switchTab('input');
        }
        return true;
      } catch (e) {
        console.error('Failed to load config from hash:', e);
        return false;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
</html>
