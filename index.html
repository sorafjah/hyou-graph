<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>グラフ作成・共有ツール</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    input, select, button {
      min-height: 40px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- 上部ナビゲーションヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 flex justify-between items-center h-14">
      <!-- タブ切り替えボタン -->
      <div id="tabNav" class="flex space-x-2">
        <button id="tabBtnInput" onclick="switchTab('input')" class="px-4 py-2 rounded-lg font-bold transition-all text-sm flex items-center gap-2 bg-indigo-600 text-white shadow">
          <span>1. データ詳細設定</span>
        </button>
        <button id="tabBtnGraph" onclick="switchTab('graph')" class="px-4 py-2 rounded-lg font-bold transition-all text-sm flex items-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200">
          <span>2. グラフ表示</span>
        </button>
      </div>

      <!-- 共有ボタン -->
      <button onclick="openShareModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-bold shadow flex items-center gap-1.5 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
        <span>Classroom共有用リンク</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6">

    <!-- ==================== ページ 1: データ入力 ==================== -->
    <div id="pageInput" class="space-y-6">

      <!-- 1. 基本設定 -->
      <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-700 border-b pb-2 mb-4 flex items-center gap-2">
          <span class="w-2 h-4 bg-indigo-600 rounded-full"></span>
          グラフの基本設定
        </h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">グラフのタイトル</label>
            <input type="text" id="graphTitle" value="1週間の最高気温の移り変わり" oninput="onDataChanged()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">横軸の項目名</label>
              <input type="text" id="xAxisLabel" value="曜日" oninput="onDataChanged()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">縦軸の項目名</label>
              <input type="text" id="yAxisLabel" value="最高気温" oninput="onDataChanged()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">単位</label>
              <input type="text" id="yAxisUnit" value="℃" placeholder="例: ℃, 人, 個" oninput="onDataChanged()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
          </div>
        </div>
      </section>

      <!-- 2. グラフの種類と軸調整 -->
      <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-700 border-b pb-2 mb-4 flex items-center gap-2">
          <span class="w-2 h-4 bg-indigo-600 rounded-full"></span>
          グラフの目盛り設定
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">縦軸の最小値（任意）</label>
            <input type="number" id="yMin" placeholder="自動設定" oninput="onDataChanged()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">縦軸の最大値（任意）</label>
            <input type="number" id="yMax" placeholder="自動設定" oninput="onDataChanged()" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
        </div>
      </section>

      <!-- 3. データ表の編集 -->
      <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center border-b pb-2 mb-4">
          <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
            <span class="w-2 h-4 bg-indigo-600 rounded-full"></span>
            表データの編集
          </h2>
          <div class="flex gap-2">
            <button onclick="addRow()" class="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold transition-colors">＋ 行を追加</button>
            <button onclick="removeRow()" class="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg text-xs font-bold transition-colors">－ 削除</button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
              <tr>
                <th class="p-2.5 w-12 text-center">#</th>
                <th class="p-2.5">項目名</th>
                <th class="p-2.5 w-40">数値</th>
              </tr>
            </thead>
            <tbody id="dataTableBody" class="divide-y divide-slate-100">
              <!-- 初期データ -->
              <tr><td class="text-center font-bold text-slate-400">1</td><td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="月"></td><td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="18"></td></tr>
              <tr><td class="text-center font-bold text-slate-400">2</td><td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="火"></td><td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="20"></td></tr>
              <tr><td class="text-center font-bold text-slate-400">3</td><td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="水"></td><td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="19"></td></tr>
              <tr><td class="text-center font-bold text-slate-400">4</td><td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="木"></td><td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="22"></td></tr>
              <tr><td class="text-center font-bold text-slate-400">5</td><td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="金"></td><td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="25"></td></tr>
              <tr><td class="text-center font-bold text-slate-400">6</td><td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="土"></td><td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="23"></td></tr>
              <tr><td class="text-center font-bold text-slate-400">7</td><td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="日"></td><td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="21"></td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>

    <!-- ==================== ページ 2: グラフ表示 ==================== -->
    <div id="pageGraph" class="hidden space-y-6">

      <!-- グラフカード -->
      <div class="bg-white rounded-xl p-5 md:p-6 shadow-sm border border-slate-200 space-y-6">
        
        <!-- グラフ上部ツールバー（グラフ種類の切替） -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 gap-3">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-indigo-600 rounded-full inline-block"></span>
            <span class="font-bold text-slate-800 text-sm md:text-base">グラフビュー</span>
          </div>

          <!-- グラフ表示画面でのグラフ種類選択 -->
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label class="text-xs font-bold text-slate-500 whitespace-nowrap">グラフの種類:</label>
            <select id="chartType" onchange="renderGraph()" class="w-full sm:w-auto px-3 py-1.5 border border-indigo-200 bg-indigo-50 rounded-lg font-bold text-indigo-700 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="line">折れ線グラフ（変化・推移）</option>
              <option value="bar">棒グラフ（数量の比較）</option>
              <option value="pie">円グラフ（割合・構成比）</option>
            </select>
          </div>
        </div>

        <!-- グラフ描画キャンバス -->
        <div class="chart-container relative w-full h-[360px] md:h-[420px]">
          <canvas id="myChart"></canvas>
        </div>

        <!-- グラフ表示画面でのインライン数値変更（即時反映） -->
        <div class="border-t border-slate-200 pt-5">
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
              <span>データ表（数値の直接変更が可能です）</span>
            </h3>
            <div class="flex gap-1.5">
              <button onclick="addRow(); renderGraph();" class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded text-xs font-bold">＋ 項目追加</button>
              <button onclick="removeRow(); renderGraph();" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded text-xs font-bold">－ 削除</button>
            </div>
          </div>

          <!-- インライン編集可能なデータテーブル -->
          <div id="graphPageTable" class="overflow-x-auto">
            <!-- JavaScriptで連動生成 -->
          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- モーダル: 共有リンク生成 -->
  <div id="shareModal" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-5">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <span class="text-emerald-600">🔗</span> 生徒共有用リンクの作成
        </h3>
        <button onclick="closeShareModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
      </div>

      <p class="text-xs text-slate-600 leading-relaxed">
        現在設定されているデータ（タイトル、数値、単位等）を含んだ専用のURLを発行します。Google ClassroomにこのURLを貼り付けて共有できます。
      </p>

      <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <label class="block text-xs font-bold text-slate-700">生徒に共有する画面モード</label>
        
        <label class="flex items-start gap-2.5 cursor-pointer">
          <input type="radio" name="shareMode" value="graph_only" checked class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
          <div>
            <span class="text-sm font-bold text-slate-800 block">グラフ表示画面のみ共有（おすすめ）</span>
            <span class="text-xs text-slate-500 block">生徒はグラフ画面からスタートし、直接データの数値変更や種類切替ができます。</span>
          </div>
        </label>

        <label class="flex items-start gap-2.5 cursor-pointer pt-2 border-t border-slate-200">
          <input type="radio" name="shareMode" value="all" class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
          <div>
            <span class="text-sm font-bold text-slate-800 block">全機能（データ入力＋グラフ）を共有</span>
            <span class="text-xs text-slate-500 block">タブ切り替えも含め、すべての設定項目にアクセスできるようにします。</span>
          </div>
        </label>
      </div>

      <div>
        <button onclick="generateShareUrl()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow transition-colors">
          URLを生成してクリップボードにコピー
        </button>
      </div>

      <div id="copySuccessMsg" class="hidden p-2.5 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-lg text-center border border-emerald-200">
        ✓ 共有URLをコピーしました！Classroom等に貼り付けてご活用ください。
      </div>
    </div>
  </div>

  <script>
    let chartInstance = null;
    let currentTab = 'input';

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
      // URLクエリパラメータの確認（共有リンクからのアクセス）
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('data')) {
        loadDataFromUrl(urlParams);
      } else {
        // イベントリスナーの登録
        bindInputEvents();
      }

      // タブの初期表示
      const shareModeParam = urlParams.get('mode');
      if (shareModeParam === 'graph_only') {
        // グラフのみモードの場合はデータ入力タブを非表示にし、直接グラフ画面へ
        document.getElementById('tabNav').classList.add('hidden');
        switchTab('graph');
      } else {
        switchTab('input');
      }
    });

    // 入力変更イベントのバインド
    function bindInputEvents() {
      const tbody = document.getElementById('dataTableBody');
      tbody.removeEventListener('input', onDataChanged);
      tbody.addEventListener('input', onDataChanged);
    }

    function onDataChanged() {
      if (currentTab === 'graph') {
        renderGraph();
      }
    }

    // タブ切り替え処理
    function switchTab(tabName) {
      currentTab = tabName;
      const pageInput = document.getElementById('pageInput');
      const pageGraph = document.getElementById('pageGraph');
      const tabBtnInput = document.getElementById('tabBtnInput');
      const tabBtnGraph = document.getElementById('tabBtnGraph');

      if (tabName === 'input') {
        pageInput.classList.remove('hidden');
        pageGraph.classList.add('hidden');
        
        tabBtnInput.className = "px-4 py-2 rounded-lg font-bold transition-all text-sm flex items-center gap-2 bg-indigo-600 text-white shadow";
        tabBtnGraph.className = "px-4 py-2 rounded-lg font-bold transition-all text-sm flex items-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        pageInput.classList.add('hidden');
        pageGraph.classList.remove('hidden');

        tabBtnGraph.className = "px-4 py-2 rounded-lg font-bold transition-all text-sm flex items-center gap-2 bg-indigo-600 text-white shadow";
        tabBtnInput.className = "px-4 py-2 rounded-lg font-bold transition-all text-sm flex items-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200";

        renderGraph();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // 行の追加
    function addRow() {
      const tbody = document.getElementById('dataTableBody');
      const rowCount = tbody.children.length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="text-center font-bold text-slate-400 p-2">${rowCount}</td>
        <td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="項目${rowCount}"></td>
        <td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="0"></td>
      `;
      tbody.appendChild(tr);
      bindInputEvents();
    }

    // 行の削除
    function removeRow() {
      const tbody = document.getElementById('dataTableBody');
      if (tbody.children.length > 1) {
        tbody.removeChild(tbody.lastChild);
        bindInputEvents();
      }
    }

    // グラフ描画と表データの同期
    function renderGraph() {
      const title = document.getElementById('graphTitle').value || '';
      const xLabel = document.getElementById('xAxisLabel').value || '';
      const yLabel = document.getElementById('yAxisLabel').value || '';
      const yUnit = document.getElementById('yAxisUnit').value || '';
      const chartType = document.getElementById('chartType').value;

      const fullYLabel = yUnit ? `${yLabel} (${yUnit})` : yLabel;

      // データ取得
      const labels = [];
      const data = [];
      const labelInputs = document.querySelectorAll('.input-label');
      const valInputs = document.querySelectorAll('.input-val');

      labelInputs.forEach((input, index) => {
        labels.push(input.value || `項目${index + 1}`);
        data.push(parseFloat(valInputs[index].value) || 0);
      });

      // グラフ画面下の編集可能テーブルを同期生成
      syncInteractiveTable(labels, data, xLabel, fullYLabel);

      const yMinVal = document.getElementById('yMin').value;
      const yMaxVal = document.getElementById('yMax').value;

      const ctx = document.getElementById('myChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      // カラーパレット
      const colors = [
        '#3b82f6', '#ef4444', '#10b981', '#f59e0b', 
        '#8b5cf6', '#ec4899', '#14b8a6', '#64748b'
      ];

      let scalesConfig = {};
      if (chartType !== 'pie') {
        scalesConfig = {
          x: {
            title: {
              display: !!xLabel,
              text: xLabel,
              font: { weight: 'bold', size: 13 },
              color: '#334155'
            },
            ticks: { color: '#334155', font: { size: 12 } },
            grid: { color: '#f1f5f9' }
          },
          y: {
            title: {
              display: !!fullYLabel,
              text: fullYLabel,
              font: { weight: 'bold', size: 13 },
              color: '#334155'
            },
            ticks: { color: '#334155', font: { size: 12 } },
            grid: { color: '#e2e8f0' },
            min: yMinVal !== '' ? parseFloat(yMinVal) : undefined,
            max: yMaxVal !== '' ? parseFloat(yMaxVal) : undefined
          }
        };
      }

      chartInstance = new Chart(ctx, {
        type: chartType,
        data: {
          labels: labels,
          datasets: [{
            label: fullYLabel || '数値',
            data: data,
            backgroundColor: chartType === 'pie' ? colors : (chartType === 'bar' ? '#3b82f6' : 'rgba(59, 130, 246, 0.15)'),
            borderColor: chartType === 'pie' ? '#ffffff' : '#2563eb',
            borderWidth: 2,
            pointBackgroundColor: '#2563eb',
            pointRadius: 4,
            tension: 0.1,
            fill: chartType === 'line'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: !!title,
              text: title,
              font: { size: 18, weight: 'bold' },
              color: '#0f172a',
              padding: { bottom: 16 }
            },
            legend: {
              display: chartType === 'pie',
              position: 'bottom',
              labels: { color: '#334155', font: { size: 12 } }
            }
          },
          scales: scalesConfig
        }
      });
    }

    // グラフ画面用のインタラクティブテーブル生成（直接入力＆即時反映）
    function syncInteractiveTable(labels, data, xLabel, yLabel) {
      const container = document.getElementById('graphPageTable');
      
      let html = `
        <table class="w-full text-sm border-collapse border border-slate-300 min-w-[500px]">
          <thead>
            <tr class="bg-slate-100 text-slate-800">
              <th class="border border-slate-300 p-2 font-bold w-28 bg-slate-200">${xLabel || '項目'}</th>
      `;
      
      labels.forEach((l, idx) => {
        html += `
          <th class="border border-slate-300 p-1 font-bold text-center">
            <input type="text" data-index="${idx}" class="sync-label w-full px-1.5 py-1 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded text-center bg-transparent font-bold" value="${l}">
          </th>
        `;
      });

      html += `
            </tr>
          </thead>
          <tbody>
            <tr>
              <th class="border border-slate-300 p-2 font-bold bg-slate-100 text-slate-700">${yLabel || '数値'}</th>
      `;

      data.forEach((d, idx) => {
        html += `
          <td class="border border-slate-300 p-1 text-center">
            <input type="number" data-index="${idx}" class="sync-val w-full px-1.5 py-1 border border-slate-200 focus:border-indigo-500 rounded text-center font-bold text-indigo-700 bg-white" value="${d}">
          </td>
        `;
      });

      html += `
            </tr>
          </tbody>
        </table>
      `;

      container.innerHTML = html;

      // グラフ画面内での入力イベントをページ1の元の入力フィールドへ同期
      container.querySelectorAll('.sync-label').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = e.target.getAttribute('data-index');
          const targetInputs = document.querySelectorAll('.input-label');
          if (targetInputs[idx]) {
            targetInputs[idx].value = e.target.value;
            renderGraph();
          }
        });
      });

      container.querySelectorAll('.sync-val').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = e.target.getAttribute('data-index');
          const targetInputs = document.querySelectorAll('.input-val');
          if (targetInputs[idx]) {
            targetInputs[idx].value = e.target.value;
            renderGraph();
          }
        });
      });
    }

    // 共有モーダルの操作
    function openShareModal() {
      document.getElementById('shareModal').classList.remove('hidden');
      document.getElementById('copySuccessMsg').classList.add('hidden');
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.add('hidden');
    }

    // データ状態をURLパラメータにエンコードしてクリップボードに保存
    function generateShareUrl() {
      const shareMode = document.querySelector('input[name="shareMode"]:checked').value;

      const labels = [];
      const data = [];
      document.querySelectorAll('.input-label').forEach(i => labels.push(i.value));
      document.querySelectorAll('.input-val').forEach(i => data.push(i.value));

      const payload = {
        title: document.getElementById('graphTitle').value,
        xLabel: document.getElementById('xAxisLabel').value,
        yLabel: document.getElementById('yAxisLabel').value,
        yUnit: document.getElementById('yAxisUnit').value,
        chartType: document.getElementById('chartType').value,
        yMin: document.getElementById('yMin').value,
        yMax: document.getElementById('yMax').value,
        labels: labels,
        data: data
      };

      // JSON文字列化してBase64エンコード
      const jsonStr = JSON.stringify(payload);
      const encodedData = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonStr))));

      const baseUrl = window.location.href.split('?')[0];
      const shareUrl = `${baseUrl}?mode=${shareMode}&data=${encodedData}`;

      // クリップボードへのコピー実行
      copyToClipboard(shareUrl);

      document.getElementById('copySuccessMsg').classList.remove('hidden');
    }

    // クリップボードコピー処理 (iFrame制限対応)
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Copy failed', err);
        }
        document.body.removeChild(textArea);
      }
    }

    // URLからデータを復元
    function loadDataFromUrl(urlParams) {
      try {
        const rawData = urlParams.get('data');
        if (!rawData) return;

        const jsonStr = decodeURIComponent(escape(atob(decodeURIComponent(rawData))));
        const payload = JSON.parse(jsonStr);

        if (payload.title !== undefined) document.getElementById('graphTitle').value = payload.title;
        if (payload.xLabel !== undefined) document.getElementById('xAxisLabel').value = payload.xLabel;
        if (payload.yLabel !== undefined) document.getElementById('yAxisLabel').value = payload.yLabel;
        if (payload.yUnit !== undefined) document.getElementById('yAxisUnit').value = payload.yUnit;
        if (payload.chartType !== undefined) document.getElementById('chartType').value = payload.chartType;
        if (payload.yMin !== undefined) document.getElementById('yMin').value = payload.yMin;
        if (payload.yMax !== undefined) document.getElementById('yMax').value = payload.yMax;

        if (payload.labels && payload.data) {
          const tbody = document.getElementById('dataTableBody');
          tbody.innerHTML = '';
          payload.labels.forEach((label, idx) => {
            const val = payload.data[idx] !== undefined ? payload.data[idx] : 0;
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="text-center font-bold text-slate-400 p-2">${idx + 1}</td>
              <td class="p-1.5"><input type="text" class="input-label w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="${label}"></td>
              <td class="p-1.5"><input type="number" class="input-val w-full px-2 py-1.5 border rounded focus:ring-1 focus:ring-indigo-500" value="${val}"></td>
            `;
            tbody.appendChild(tr);
          });
          bindInputEvents();
        }
      } catch (e) {
        console.error("データの読み込みに失敗しました", e);
      }
    }
  </script>
</body>
